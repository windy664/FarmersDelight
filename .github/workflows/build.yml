name: Build

on:
  push:
    branches: [ "26.2" ]
  pull_request:
    branches: [ "26.2" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FarmersDelight-jars
          path: build/libs/*.jar
          if-no-files-found: warn
