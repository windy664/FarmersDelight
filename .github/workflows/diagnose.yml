name: Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare Minecraft artifacts
        run: ./gradlew createMinecraftArtifacts --stacktrace -Dorg.gradle.jvmargs=-Xmx4g

      - name: Grep API package locations
        run: |
          echo "### collecting class listings from all cached jars ###"
          find ~/.gradle -name '*.jar' 2>/dev/null > /tmp/jars.txt
          wc -l /tmp/jars.txt
          : > /tmp/all_classes.txt
          while read -r j; do
            unzip -l "$j" 2>/dev/null | awk '{print $4}'
          done < /tmp/jars.txt | grep -E '\.class$' | sort -u > /tmp/all_classes.txt
          echo "total unique class entries: $(wc -l < /tmp/all_classes.txt)"
          echo ""
          CP=$(paste -sd: /tmp/jars.txt)
          echo "==== ItemStack: craftingRemainder / onCraftedBy ===="
          javap -cp "$CP" -public net.minecraft.world.item.ItemStack 2>&1 | grep -iE 'craftingRemainder|onCraft'
          echo ""
          echo "==== ItemStackTemplate ===="
          javap -cp "$CP" -public net.minecraft.world.item.ItemStackTemplate 2>&1 | grep -E 'public' | head -40
          echo ""
          echo "==== Blocks: WOOL / CARPET fields ===="
          javap -cp "$CP" -public net.minecraft.world.level.block.Blocks 2>&1 | grep -iE 'WOOL|CARPET' | head -40
          echo ""
          echo "==== Sheets: SIGN fields + SpriteMapper ===="
          javap -cp "$CP" -public net.minecraft.client.renderer.Sheets 2>&1 | grep -iE 'SIGN|sheet' | head -30
          echo ""
          echo "==== RecipeBookComponent: abstract methods ===="
          javap -cp "$CP" -p net.minecraft.client.gui.screens.recipebook.RecipeBookComponent 2>&1 | grep -E 'abstract|fillGhost|public' | head -40
          echo ""
          echo "==== VanillaContainerWrapper ctors ===="
          javap -cp "$CP" -p net.neoforged.neoforge.items.wrapper.VanillaContainerWrapper 2>&1 | grep -E 'VanillaContainerWrapper|public|protected' | head -20
          for c in x ; do
            echo ""
          done
