name: Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare Minecraft artifacts
        run: ./gradlew createMinecraftArtifacts --stacktrace -Dorg.gradle.jvmargs=-Xmx4g

      - name: Grep API package locations
        run: |
          echo "### collecting class listings from all cached jars ###"
          find ~/.gradle -name '*.jar' 2>/dev/null > /tmp/jars.txt
          wc -l /tmp/jars.txt
          : > /tmp/all_classes.txt
          while read -r j; do
            unzip -l "$j" 2>/dev/null | awk '{print $4}'
          done < /tmp/jars.txt | grep -E '\.class$' | sort -u > /tmp/all_classes.txt
          echo "total unique class entries: $(wc -l < /tmp/all_classes.txt)"
          echo ""
          CP=$(paste -sd: /tmp/jars.txt)
          echo "==== ColorCollection ===="
          javap -cp "$CP" -p net.minecraft.world.level.block.ColorCollection 2>&1 | grep -E 'public|protected' | head -20
          echo ""
          echo "==== VanillaContainerWrapper ===="
          javap -cp "$CP" -p net.neoforged.neoforge.items.wrapper.VanillaContainerWrapper 2>&1 | grep -E 'VanillaContainerWrapper|public|protected|static' | head -20
          echo ""
          echo "==== Minecraft getGuiTicks/getDeltaTracker ===="
          javap -cp "$CP" -public net.minecraft.client.Minecraft 2>&1 | grep -iE 'GuiTick|getTimer|deltaTracker|hideGui' | head
          echo "==== Gui getGuiTicks ===="
          javap -cp "$CP" -public net.minecraft.client.gui.Gui 2>&1 | grep -iE 'GuiTick|getTick' | head
          echo ""
          echo "==== SignRenderer createSignModel ===="
          javap -cp "$CP" -public net.minecraft.client.renderer.blockentity.SignRenderer 2>&1 | grep -iE 'createSignModel|SignModel|Attachment' | head
          echo "==== find SignModel/Attachment classes ===="
          grep -E 'SignModel|/Attachment\.class|createSignModel' /tmp/all_classes.txt | grep -vE '\$' | sed 's#\.class##;s#/#.#g' | sort -u | head
          echo ""
          echo "==== RecipeBookComponent full (p) ===="
          javap -cp "$CP" -p net.minecraft.client.gui.screens.recipebook.RecipeBookComponent 2>&1 | grep -E 'abstract|protected|public' | head -50
          echo ""
          echo "==== StoveBlockEntity getLightCoords? BlockRenderDispatcher loc ===="
          grep -E '/BlockRenderDispatcher\.class' /tmp/all_classes.txt | sed 's#\.class##;s#/#.#g'
          for c in x ; do
            echo ""
          done
