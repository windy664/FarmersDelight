name: Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare Minecraft artifacts
        run: ./gradlew createMinecraftArtifacts --stacktrace -Dorg.gradle.jvmargs=-Xmx4g

      - name: Grep API package locations
        run: |
          echo "### collecting class listings from all cached jars ###"
          find ~/.gradle -name '*.jar' 2>/dev/null > /tmp/jars.txt
          wc -l /tmp/jars.txt
          : > /tmp/all_classes.txt
          while read -r j; do
            unzip -l "$j" 2>/dev/null | awk '{print $4}'
          done < /tmp/jars.txt | grep -E '\.class$' | sort -u > /tmp/all_classes.txt
          echo "total unique class entries: $(wc -l < /tmp/all_classes.txt)"
          echo ""
          dot() { sed 's#\.class$##;s#/#.#g' | sort -u ; }
          echo "############ net.minecraft.advancements tree ############"
          grep -E '^net/minecraft/advancements/' /tmp/all_classes.txt | grep -vE '\$' | dot
          echo ""
          echo "############ net.minecraft.client.data.models tree ############"
          grep -E '^net/minecraft/client/data/models/' /tmp/all_classes.txt | grep -vE '\$' | dot
          echo ""
          echo "############ neoforge datagen leftovers (client.model / data) ############"
          grep -E '^net/neoforged/neoforge/(client/model|data|model)/' /tmp/all_classes.txt | grep -vE '\$' | dot | head -60
          echo ""
          echo "############ DataComponentInput / DataComponentGetter ############"
          grep -E '/(DataComponentInput|DataComponentGetter)\.class$' /tmp/all_classes.txt | dot
          echo ""
          echo "############ neoforge items + transfer trees ############"
          grep -E '^net/neoforged/neoforge/(items|transfer|capabilities)/' /tmp/all_classes.txt | grep -vE '\$' | dot | head -80
          echo ""
          echo "############ javap key handler classes ############"
          NEOJAR=$(while read -r j; do unzip -l "$j" 2>/dev/null | grep -q 'neoforged/neoforge/items/IItemHandler.class' && echo "$j" && break; done < /tmp/jars.txt)
          echo "NEOJAR=$NEOJAR"
          for c in \
            net.neoforged.neoforge.items.IItemHandler \
            net.neoforged.neoforge.items.ItemStackHandler \
            net.neoforged.neoforge.items.ItemStacksResourceHandler \
            net.neoforged.neoforge.items.IItemHandlerModifiable ; do
            echo "==== javap $c ===="
            javap -cp "$NEOJAR" -public "$c" 2>&1 | head -40
            echo ""
          done
